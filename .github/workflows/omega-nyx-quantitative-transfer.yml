name: Omega NYX exact-derivation transfer

on:
  workflow_dispatch:
  push:
    branches: [sol/omega-institutional-spine]
    paths: [scripts/omega/nyx-quantitative-model-repair-fixtures.ts]

permissions:
  contents: read

concurrency:
  group: omega-nyx-quantitative-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quantitative-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen test dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the native mechanism and negative oracle controls without credentials
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBoundedReasoningWorkbench.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaQuantitativeConstraintFeedback.test.ts
      - name: Run one bounded frozen comparison
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NYX_QUANTITATIVE_FRESH: '1'
          NYX_QUANTITATIVE_SLOT_TRANSFER: '1'
          NYX_QUANTITATIVE_EQUATION_TRANSFER: '1'
          NYX_QUANTITATIVE_COMPOSED_TRANSFER: '1'
          NYX_QUANTITATIVE_COMMAND_TRANSFER: '1'
          NYX_QUANTITATIVE_CONSTRAINT_FEEDBACK: '1'
          NYX_QUANTITATIVE_COUPLED_FEEDBACK: '1'
          NYX_QUANTITATIVE_PROTOCOL_REPAIR: '1'
          NYX_QUANTITATIVE_REPAIR_CONTEXT: '1'
          NYX_QUANTITATIVE_PROVIDER_DIAGNOSTIC: '1'
          NYX_QUANTITATIVE_MODEL_REPAIR: '1'
          NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-quantitative-transfer-live-eval.ts
      - name: Preserve sanitized comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-quantitative-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-quantitative-transfer-*.json
          if-no-files-found: warn
