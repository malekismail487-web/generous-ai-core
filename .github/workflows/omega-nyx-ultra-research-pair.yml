name: Omega Ultra bounded research comparison
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [BENCHMARK_PAIR, DEVELOPMENT_EFFORT]
        default: BENCHMARK_PAIR
        description: Frozen benchmark pair or separate synthetic native-effort development ablation
  push:
    branches: [sol/omega-institutional-spine]
    paths: [.github/workflows/omega-nyx-ultra-research-pair.yml]
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-ultra:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'eval(nyx): freeze Ultra native effort development ablation'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NYX_ULTRA_RESEARCH_MODE: ${{ github.event_name == 'push' && 'DEVELOPMENT_EFFORT' || inputs.mode || 'BENCHMARK_PAIR' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify independent grading and preserved safety before inference
        env:
          OMEGA_POLYNOMIAL_PYTHON: python3
        run: |
          npm run typecheck:ratchet
          node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --types node --skipLibCheck scripts/omega/nyx-ultra-research-pair.ts scripts/omegaUltraResearchPair.test.ts scripts/omegaUltraEffortDevelopment.test.ts
          npm run security:secrets
          npm run omega:tests
      - name: Reuse pinned author-data preparation without exposing references
        if: env.NYX_ULTRA_RESEARCH_MODE == 'BENCHMARK_PAIR'
        id: prepare
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git -c credential.helper= clone --filter=blob:none --no-checkout https://github.com/Idavidrein/gpqa.git "$RUNNER_TEMP/gpqa"
          git -C "$RUNNER_TEMP/gpqa" checkout 56686c06f5e19865c153de0fdb11be3890014df7
          python -B scripts/omega/benchmarks/prepare-text-benchmarks.py prepare-gpqa --gpqa "$RUNNER_TEMP/gpqa" --output "$RUNNER_TEMP/ultra-pair-gpqa.json"
          python -m pip install --disable-pip-version-check duckdb==1.5.6
          curl --fail --location --proto '=https' --tlsv1.2 'https://huggingface.co/datasets/MathArena/aime_2026/resolve/d2de22f3c656b4f56cf8981212186377d1e23bc3/data/train-00000-of-00001.parquet' --output "$RUNNER_TEMP/ultra-pair-aime.parquet"
          python -B scripts/omega/benchmarks/prepare-text-benchmarks.py prepare-aime-2026 --aime "$RUNNER_TEMP/ultra-pair-aime.parquet" --output "$RUNNER_TEMP/ultra-pair-aime.json" > "$RUNNER_TEMP/ultra-pair-preparation.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ultra-pair-preparation.json').read_text())
          assert metadata['prepared'] and metadata['population'] == 30 and metadata['answersLogged'] is False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('aime_sha256=' + metadata['preparedSha256'] + '\n')
          print(json.dumps(metadata))
          PY
      - name: Verify fresh availability then execute one bounded paired pilot
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          NYX_TEXT_EVALUATION_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          NYX_ULTRA_PAIR_AIME: ${{ runner.temp }}/ultra-pair-aime.json
          NYX_ULTRA_PAIR_AIME_SHA256: ${{ steps.prepare.outputs.aime_sha256 }}
          NYX_ULTRA_PAIR_GPQA: ${{ runner.temp }}/ultra-pair-gpqa.json
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-ultra-research-pair.ts
      - name: Preserve sanitized outcomes including negative or incomplete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-ultra-research-pair-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-ultra-pair-*.json
          if-no-files-found: error
