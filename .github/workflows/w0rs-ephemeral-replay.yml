name: W0-RS ephemeral database replay

on:
  workflow_dispatch:
  push:
    branches:
      - "sol/w0-rs-1-truth-map"
    paths:
      - ".github/workflows/w0rs-ephemeral-replay.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Docker-compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/w0rs-diagnostics"
          mkdir -p "$diagnostics"
          docker version > "$diagnostics/docker-version.txt" 2>&1
          docker info > "$diagnostics/docker-info.txt" 2>&1

      - name: Install pinned Supabase CLI
        id: supabase
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/w0rs-diagnostics"
          printf 'supabase=%s\n' "$(supabase --version)" > "$diagnostics/tool-versions.txt"
          printf 'docker-client=%s\n' "$(docker version --format '{{.Client.Version}}')" >> "$diagnostics/tool-versions.txt"
          printf 'docker-server=%s\n' "$(docker version --format '{{.Server.Version}}')" >> "$diagnostics/tool-versions.txt"

      - name: Prepare isolated replay input
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          migration_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$migration_count" -eq 128
          test ! -e supabase/.temp/project-ref
          git diff --exit-code -- supabase/migrations

          replay_root="$RUNNER_TEMP/w0rs-replay"
          project_id="w0rs-2b-${GITHUB_RUN_ID}"
          mkdir -p "$replay_root"
          rsync -a --exclude='.git' ./ "$replay_root/"

          (
            cd "$GITHUB_WORKSPACE"
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/source-migrations.sha256"
          (
            cd "$replay_root"
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/replay-migrations.sha256"
          diff -u "$RUNNER_TEMP/source-migrations.sha256" "$RUNNER_TEMP/replay-migrations.sha256"

          sed -i -E "s/^project_id = .*/project_id = \"${project_id}\"/" "$replay_root/supabase/config.toml"
          printf 'migration_count=%s\nproject_id=%s\n' "$migration_count" "$project_id" \
            > "$RUNNER_TEMP/w0rs-diagnostics/replay-input.txt"
          echo "replay_root=$replay_root" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Replay migrations on empty local stack
        id: replay
        shell: bash
        env:
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          raw_log="$RUNNER_TEMP/w0rs-replay.raw.log"
          sanitized_log="$RUNNER_TEMP/w0rs-diagnostics/replay.log"

          set +e
          supabase --workdir "$REPLAY_ROOT" start --debug > "$raw_log" 2>&1
          replay_exit=$?
          set -e
          echo "exit_code=$replay_exit" >> "$GITHUB_OUTPUT"

          python3 - "$raw_log" "$sanitized_log" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = text.replace(os.environ["GITHUB_WORKSPACE"], "<workspace>")
          text = text.replace(os.environ["RUNNER_TEMP"], "<runner-temp>")
          text = re.sub(r"https://[a-z0-9-]+\.supabase\.co", "https://<redacted>.supabase.co", text, flags=re.I)
          text = re.sub(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}", "<redacted-jwt>", text)
          text = re.sub(r"(?:sbp_|sb_secret_)[A-Za-z0-9_-]{16,}", "<redacted-secret>", text)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          PY
          rm -f "$raw_log"

      - name: Classify authentic PostgreSQL failure
        shell: bash
        env:
          REPLAY_EXIT_CODE: ${{ steps.replay.outputs.exit_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_migration = "20260202112822_a61c6b14-58e3-4d54-a6ec-f025d3ae0486.sql"
          expected_sqlstate = "42703"
          log_path = Path(os.environ["RUNNER_TEMP"]) / "w0rs-diagnostics" / "replay.log"
          log = log_path.read_text(encoding="utf-8", errors="replace")
          lines = log.splitlines()
          applied = re.findall(r"Applying migration\s+([^\s]+\.sql)", log, flags=re.I)
          states = re.findall(r"SQLSTATE[\s:()]+([0-9A-Z]{5})", log, flags=re.I)
          migration = applied[-1] if applied else None
          sqlstate = states[0].upper() if states else None
          error_index = next((i for i, line in enumerate(lines) if "SQLSTATE" in line or "ERROR:" in line), None)
          diagnostic = [] if error_index is None else lines[max(0, error_index - 2):error_index + 10]
          replay_exit = int(os.environ["REPLAY_EXIT_CODE"])
          matched = replay_exit != 0 and migration == expected_migration and sqlstate == expected_sqlstate
          summary = {
              "schemaVersion": 1,
              "scope": "W0-RS-2B ephemeral local-only database replay",
              "canonicalRepairApplied": False,
              "noncanonicalDiagnosticShimApplied": False,
              "replayExitCode": replay_exit,
              "firstFailure": {
                  "migration": migration,
                  "sqlstate": sqlstate,
                  "diagnostic": diagnostic,
              },
              "matchesDeterministicPrediction": matched,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "w0rs-diagnostics" / "summary.json"
          output.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          if not matched:
              raise SystemExit("Replay outcome did not match the migration-20 SQLSTATE-42703 prediction")
          PY

      - name: Destroy ephemeral stack
        if: ${{ always() }}
        shell: bash
        env:
          PROJECT_ID: ${{ steps.prepare.outputs.project_id }}
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          stop_exit="not-attempted"
          remaining=0
          if command -v supabase >/dev/null 2>&1 && [ -n "${REPLAY_ROOT:-}" ] && [ -d "$REPLAY_ROOT" ]; then
            set +e
            supabase --workdir "$REPLAY_ROOT" stop --no-backup >/dev/null 2>&1
            stop_exit=$?
            set -e
          fi
          if [ -n "${PROJECT_ID:-}" ]; then
            remaining="$(docker ps -a --format '{{.Names}}' | grep -F -c "$PROJECT_ID" || true)"
          fi
          printf 'stop_exit=%s\nremaining_project_containers=%s\n' "$stop_exit" "$remaining" \
            > "$RUNNER_TEMP/w0rs-diagnostics/cleanup.txt"
          test "$remaining" -eq 0

      - name: Upload sanitized replay diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w0rs-2b-ephemeral-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/w0rs-diagnostics
          if-no-files-found: error
          retention-days: 7
