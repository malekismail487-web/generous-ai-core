name: Omega NYX fresh hosted-array repair transfer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate unchanged admission and separate fresh task oracles
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaR3DNyxNemotronCognition.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaArcNyxIntegration.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBenchmarkCapabilityHarness.test.ts
      - name: Compare old and repaired wire grammar on fresh engineering domains
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NYX_ARRAY_BOUND_COMPARISON: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-source-representation-cycle.ts
      - name: Download pinned actual ARC dataset outside candidate repository
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/arcprize/ARC-AGI-2.git "$RUNNER_TEMP/arc-agi-2"
          git -C "$RUNNER_TEMP/arc-agi-2" checkout f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Compare once on fresh actual ARC tasks without withheld-answer feedback
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NYX_ARRAY_BOUND_COMPARISON: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_ARC_DATA_ROOT: ${{ runner.temp }}/arc-agi-2
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-arc-benchmark-epoch.ts
      - name: Preserve sanitized evidence including unsuccessful outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-array-bound-transfer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-source-representation-*.json
            ${{ runner.temp }}/nyx-arc-public-*.json
          if-no-files-found: error
