name: W0-RS evidence

on:
  pull_request:
  push:
    branches:
      - "sol/w0-rs-*"
      - "sol/omega-*"

permissions:
  contents: read

jobs:
  repository-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject tracked secrets
        run: node scripts/security/scan-secrets.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen test dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run deterministic Omega protocol and orchestration harnesses
        run: node scripts/omega/run-tests.mjs
      - name: Preserve TypeScript zero ratchet
        run: npm run typecheck:ratchet
      - name: Typecheck research evaluation and recovery scripts
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext
          --moduleResolution bundler --lib ES2022,DOM --types node --skipLibCheck
          scripts/omegaNvidiaNimProvider.test.ts scripts/omegaResearchParty.test.ts
          scripts/omegaResearchExecutableTransfer.test.ts scripts/omegaNyxAdmissionGuidance.test.ts
          scripts/omegaNyxChatCli.test.ts scripts/omegaNyxLocalWebConsole.test.ts
          scripts/omegaLuminaLiveBoundary.test.ts
          scripts/omegaBoundedReasoningWorkbench.test.ts
          scripts/omegaQuantitativeConstraintFeedback.test.ts
          scripts/omegaBenchmarkCapabilityHarness.test.ts scripts/omega/benchmark-cli.ts
          scripts/omega/nyx-quantitative-transfer-live-eval.ts
          scripts/omega/nyx-research-party-live-eval.ts
      - name: Build production bundle without deployment
        run: npm run build
      - name: Verify packaged NYX matches source and launches without credentials
        run: |
          node scripts/omega/package-nyx.mjs --check
          node scripts/omega/test-nyx-package.mjs
      - name: Verify generated repository inventories
        run: node scripts/w0rs/inventory.mjs --check
      - name: Verify deterministic migration-failure evidence
        run: node scripts/w0rs/reproduce-migration-failure.mjs --check
      - name: Run dependency-free TypeScript harnesses
        run: node scripts/w0rs/run-tests.mjs --group node-offline
      - name: Run repository static audits
        run: node scripts/w0rs/run-tests.mjs --group static-audit
