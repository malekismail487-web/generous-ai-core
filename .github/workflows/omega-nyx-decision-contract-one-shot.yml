name: Omega NYX decision-required contract transfer
on:
  workflow_dispatch:
  push:
    branches: [sol/omega-institutional-spine]
    paths: [.github/workflows/omega-nyx-decision-contract-one-shot.yml]
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  decision-contract-transfer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nyx-decision-contract-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify local contract, quality, authority and separate fixture oracles without secrets
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaR3DNyxNemotronCognition.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaArcNyxIntegration.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBenchmarkCapabilityHarness.test.ts
          npm run typecheck:ratchet
          node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --types node --skipLibCheck scripts/omega/nyx-source-representation-cycle.ts scripts/omegaR3DNyxNemotronCognition.test.ts scripts/omegaArcNyxIntegration.test.ts
      - name: Compare optional and decision-required generation on four fresh engineering tasks
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NYX_DECISION_CONTRACT_COMPARISON: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-source-representation-cycle.ts
      - name: Preserve sanitized evidence including unsuccessful outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-decision-contract-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-source-representation-*.json
          if-no-files-found: error
