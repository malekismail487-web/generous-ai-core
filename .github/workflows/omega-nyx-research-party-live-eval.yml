name: Omega NYX research party live evaluation

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run the six-call output-budget diagnostic instead of the capability comparison
        required: false
        type: boolean
        default: false
      policy_comparison:
        description: Compare evidence-first and revision-after-observation through the same Omega oracle
        required: false
        type: boolean
        default: false
      allocation_comparison:
        description: Coverage comparison or paired derivation-controlled transfer; requires the matching corpus
        required: false
        type: boolean
        default: false
      comparison_tasks:
        description: Bounded live comparison task count
        required: false
        type: choice
        options: ['1', '3']
        default: '1'
      corpus:
        description: Frozen causal task corpus
        required: false
        type: choice
        options: ['LEGACY', 'EXECUTABLE_TRANSFER_V1', 'HYPOTHESIS_COVERAGE_DEVELOPMENT_V1', 'COVERAGE_TRANSFER_V1', 'COVERAGE_TRANSFER_V2', 'COVERAGE_TRANSFER_V3']
        default: 'LEGACY'
      model_concurrency:
        description: Matched model delivery concurrency for all policy arms
        required: false
        type: choice
        options: ['1', '2', '3']
        default: '3'
      comparison_task_id:
        description: Optional exact frozen transfer-task ID for focused regression only
        required: false
        type: string
        default: ''
      comparison_policy:
        description: Optional unexecuted-arm continuation; not a paired comparison
        required: false
        type: choice
        options: ['', 'REVISE_AFTER_OBSERVATION', 'EXHAUST_PRECOMMITTED_FORECASTS']
        default: ''
permissions:
  contents: read

concurrency:
  group: omega-nyx-research-party-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nyx-research-party-live:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      OMEGA_NYX_RESEARCH_DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only && '1' || '0' }}
      OMEGA_NYX_RESEARCH_POLICY_COMPARISON: ${{ inputs.policy_comparison && '1' || '0' }}
      OMEGA_NYX_HYPOTHESIS_ALLOCATION_COMPARISON: ${{ inputs.allocation_comparison && '1' || '0' }}
      OMEGA_NYX_RESEARCH_COMPARE_TASKS: ${{ inputs.comparison_tasks || '1' }}
      OMEGA_NYX_RESEARCH_CORPUS: ${{ inputs.corpus || 'LEGACY' }}
      OMEGA_NYX_RESEARCH_MODEL_CONCURRENCY: ${{ inputs.model_concurrency || '3' }}
      OMEGA_NYX_RESEARCH_COMPARE_TASK_ID: ${{ inputs.comparison_task_id || '' }}
      OMEGA_NYX_RESEARCH_COMPARE_POLICY: ${{ inputs.comparison_policy || '' }}
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Confirm encrypted credential is available
        shell: bash
        run: test -n "$NVIDIA_API_KEY"
      - name: Verify research-party, provider, authority, and TypeScript contracts
        env:
          NVIDIA_API_KEY: ''
          OMEGA_NYX_HYPOTHESIS_ALLOCATION_COMPARISON: '0'
          OMEGA_NYX_RESEARCH_CORPUS: 'LEGACY'
          OMEGA_NYX_RESEARCH_POLICY_COMPARISON: '0'
          OMEGA_NYX_RESEARCH_DIAGNOSTIC_ONLY: '0'
          OMEGA_NYX_RESEARCH_COMPARE_TASKS: '1'
          OMEGA_NYX_RESEARCH_COMPARE_TASK_ID: ''
          OMEGA_NYX_RESEARCH_COMPARE_POLICY: ''
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaResearchParty.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaResearchEvidenceFirst.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaResearchExecutableTransfer.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaR3BControlledExecution.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaR2CompositionSecuritySpec.test.ts
          npm run typecheck:ratchet
      - name: Check live provider availability before capability evaluation
        run: npm run omega:nvidia:smoke
      - name: Run bounded live research-party evaluation
        run: npm run omega:nyx:research-party-live
      - name: Upload sanitized live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-nyx-research-party-live-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-research-party-live-*.json
          if-no-files-found: warn
