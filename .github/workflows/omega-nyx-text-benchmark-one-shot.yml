name: Omega NYX authorized Nemotron Super public evaluation
on:
  push:
    branches: [sol/omega-institutional-spine]
    paths: [.github/workflows/omega-nyx-text-benchmark-one-shot.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-aime:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test intact scoped delivery and unchanged strict NYX chat boundary
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxTextBenchmark.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxChatCli.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
      - name: Prepare pinned public populations outside the candidate repository
        run: |
          python -m pip install --disable-pip-version-check duckdb==1.5.6
          git clone --filter=blob:none --no-checkout https://github.com/google-deepmind/bbeh.git "$RUNNER_TEMP/bbeh"
          git -C "$RUNNER_TEMP/bbeh" checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
          curl --fail --location --proto '=https' --tlsv1.2 'https://huggingface.co/datasets/MathArena/aime_2025/resolve/c94da77eb22bbd6439e62a323bec18493a421302/data/train-00000-of-00001.parquet' --output "$RUNNER_TEMP/aime-2025.parquet"
          python scripts/omega/benchmarks/prepare-text-benchmarks.py prepare --aime "$RUNNER_TEMP/aime-2025.parquet" --bbeh "$RUNNER_TEMP/bbeh" --output "$RUNNER_TEMP/nyx-text-data.json"
      - name: Execute all 30 AIME problems through NYX with explicitly authorized Super
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_TEXT_EPOCH_MODE: FULL_AIME
          NYX_TEXT_CONFIGURATION: SESSION_ACTION_CONTRACT
          NYX_TEXT_DELIVERY: SCOPED_FILE
          NYX_TEXT_RECOVERY_PROFILE: BOUNDED_RECOVERY
          NYX_TEXT_TRANSIENT_RECOVERY: WITHIN_SHARED_BUDGET
          NYX_TEXT_CAPACITY_SCHEDULING: BEFORE_TASK_LEASE
          NYX_TEXT_EVALUATION_MODEL: nvidia/nemotron-3-super-120b-a12b
          NYX_TEXT_DATA: ${{ runner.temp }}/nyx-text-data.json
          NYX_BBEH_ROOT: ${{ runner.temp }}/bbeh
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-text-benchmark-epoch.ts
      - name: Preserve sanitized benchmark evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-super-full-aime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-text-benchmark-*.json
            ${{ runner.temp }}/nyx-text-progress-*.json
          if-no-files-found: error
  full-bbeh:
    needs: full-aime
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare the same pinned public populations outside the candidate repository
        run: |
          python -m pip install --disable-pip-version-check duckdb==1.5.6
          git clone --filter=blob:none --no-checkout https://github.com/google-deepmind/bbeh.git "$RUNNER_TEMP/bbeh"
          git -C "$RUNNER_TEMP/bbeh" checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
          curl --fail --location --proto '=https' --tlsv1.2 'https://huggingface.co/datasets/MathArena/aime_2025/resolve/c94da77eb22bbd6439e62a323bec18493a421302/data/train-00000-of-00001.parquet' --output "$RUNNER_TEMP/aime-2025.parquet"
          python scripts/omega/benchmarks/prepare-text-benchmarks.py prepare --aime "$RUNNER_TEMP/aime-2025.parquet" --bbeh "$RUNNER_TEMP/bbeh" --output "$RUNNER_TEMP/nyx-text-data.json"
      - name: Execute all 460 BBEH Mini problems through NYX with the same Super model
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_TEXT_EPOCH_MODE: FULL_BBEH
          NYX_TEXT_CONFIGURATION: SESSION_ACTION_CONTRACT
          NYX_TEXT_DELIVERY: SCOPED_FILE
          NYX_TEXT_RECOVERY_PROFILE: BOUNDED_RECOVERY
          NYX_TEXT_TRANSIENT_RECOVERY: WITHIN_SHARED_BUDGET
          NYX_TEXT_CAPACITY_SCHEDULING: BEFORE_TASK_LEASE
          NYX_TEXT_EVALUATION_MODEL: nvidia/nemotron-3-super-120b-a12b
          NYX_TEXT_DATA: ${{ runner.temp }}/nyx-text-data.json
          NYX_BBEH_ROOT: ${{ runner.temp }}/bbeh
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-text-benchmark-epoch.ts
      - name: Preserve sanitized BBEH evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-super-full-bbeh-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-text-benchmark-*.json
            ${{ runner.temp }}/nyx-text-progress-*.json
          if-no-files-found: error
