name: Omega NYX bounded text benchmark delivery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  text-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test intact scoped delivery and unchanged strict NYX chat boundary
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxTextBenchmark.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxChatCli.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
      - name: Isolate native budget versus effort versus template controls on identical synthetic input
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OMEGA_NVIDIA_REQUEST_COMPATIBILITY: HOSTED_NATIVE_ISOLATION
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nvidia-nim-live-smoke.ts
      - name: Preserve sanitized benchmark evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-text-benchmark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-text-benchmark-*.json
            ${{ runner.temp }}/nyx-text-progress-*.json
            ${{ runner.temp }}/nyx-request-compatibility-*.json
          if-no-files-found: error
