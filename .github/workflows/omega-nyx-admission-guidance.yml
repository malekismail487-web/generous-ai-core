name: Omega NYX fresh admission-guidance transfer

on:
  workflow_dispatch:
  push:
    branches: [sol/omega-institutional-spine]
    paths:
      - scripts/omega/nyx-admission-guidance-fixtures.ts

permissions:
  contents: read

concurrency:
  group: omega-nyx-admission-guidance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NYX_QUALITY_SUITE: ADMISSION_GUIDANCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Confirm configured secret without exposing it
        shell: bash
        run: test -n "$NVIDIA_API_KEY"
      - name: Validate frozen tasks, authority and quality gates
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxAdmissionGuidance.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaVerificationIntegrity.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaCandidateEngineeringAdmission.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxEngineeringQualityAssurance.test.ts
      - name: Run current and reasoning-enabled NYX under identical configured limits
        shell: bash
        run: |
          set -euo pipefail
          for variant in CURRENT REASONING_ENABLED; do
            NYX_EXPERIMENT_VARIANT="$variant" node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-quality-v4-live-eval.ts
          done
      - name: Compare paired outcomes and realized compute
        shell: bash
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-transfer-epoch-compare.ts \
            "$RUNNER_TEMP/nyx-quality-admission_guidance-current-${GITHUB_SHA:0:12}.json" \
            "$RUNNER_TEMP/nyx-quality-admission_guidance-reasoning_enabled-${GITHUB_SHA:0:12}.json"
      - name: Upload sanitized per-arm and paired reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-nyx-admission-guidance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-quality-admission_guidance-*.json
            ${{ runner.temp }}/nyx-transfer-matched-*.json
          if-no-files-found: warn
