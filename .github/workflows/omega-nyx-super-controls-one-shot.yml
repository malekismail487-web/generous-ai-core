name: Omega NYX bounded Super reasoning-control diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-super-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify controls and preserved strict parser before live dispatch
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxTextBenchmark.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxChatCli.test.ts
      - name: Compare unmodified Super against bounded phase controls on development tasks only
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_TEXT_EPOCH_MODE: CONTRACT_DIAGNOSTIC
          NYX_TEXT_CONFIGURATION: SESSION_SUPER_PHASE_CONTRACT
          NYX_TEXT_DELIVERY: SCOPED_FILE
          NYX_TEXT_RECOVERY_PROFILE: BOUNDED_RECOVERY
          NYX_TEXT_TRANSIENT_RECOVERY: WITHIN_SHARED_BUDGET
          NYX_TEXT_EVALUATION_MODEL: nvidia/nemotron-3-super-120b-a12b
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-text-benchmark-epoch.ts
      - name: Preserve sanitized diagnostic evidence, never raw responses or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-super-controls-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-text-benchmark-${{ github.sha }}.json
          if-no-files-found: error
