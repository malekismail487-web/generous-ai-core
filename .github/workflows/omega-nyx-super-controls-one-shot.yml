name: Omega NYX bounded Super reasoning-control diagnostic
on:
  workflow_dispatch:
  push:
    branches: [sol/omega-institutional-spine]
    paths: [.github/workflows/omega-nyx-super-controls-one-shot.yml]
permissions:
  contents: read
concurrency:
  group: omega-super-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stop-requested-bbeh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: none
    steps:
      - name: Force-cancel only the operator-requested BBEH run if ordinary cancellation was ignored
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.github.com/repos/malekismail487-web/generous-ai-core/actions/runs/37665577413';
          const headers = {Authorization: `Bearer ${process.env.GH_ACTION_TOKEN}`, Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'};
          async function state() {
            const response = await fetch(url, {headers, signal: AbortSignal.timeout(15000)});
            if (!response.ok) throw Error(`cancel_status_http_${response.status}`);
            const run = await response.json();
            if (run.id !== 37665577413 || run.head_sha !== '1c0bc4f8e798364974429bcc7bb364db796493ef')
              throw Error('cancel_target_identity_mismatch');
            return run;
          }
          let run = await state();
          if (run.status !== 'completed') {
            const response = await fetch(`${url}/force-cancel`, {method: 'POST', headers, signal: AbortSignal.timeout(15000)});
            if (response.status !== 202 && response.status !== 409) throw Error(`force_cancel_http_${response.status}`);
            for (let i = 0; i < 6; i++) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              run = await state(); if (run.status === 'completed') break;
            }
          }
          console.log(JSON.stringify({runId: run.id, status: run.status, conclusion: run.conclusion}));
          if (run.status !== 'completed') throw Error('requested_run_termination_not_confirmed');
          NODE
  development-controls:
    needs: stop-requested-bbeh
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify controls and preserved strict parser before live dispatch
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxTextBenchmark.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxChatCli.test.ts
      - name: Compare unmodified Super against bounded phase controls on development tasks only
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_TEXT_EPOCH_MODE: CONTRACT_DIAGNOSTIC
          NYX_TEXT_CONFIGURATION: SESSION_SUPER_PHASE_CONTRACT
          NYX_TEXT_DELIVERY: SCOPED_FILE
          NYX_TEXT_RECOVERY_PROFILE: BOUNDED_RECOVERY
          NYX_TEXT_TRANSIENT_RECOVERY: WITHIN_SHARED_BUDGET
          NYX_TEXT_EVALUATION_MODEL: nvidia/nemotron-3-super-120b-a12b
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-text-benchmark-epoch.ts
      - name: Preserve sanitized diagnostic evidence, never raw responses or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-super-controls-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-text-benchmark-${{ github.sha }}.json
          if-no-files-found: error
