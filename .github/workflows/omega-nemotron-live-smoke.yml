name: Omega Nemotron live smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Live verification scope
        required: true
        default: full
        type: choice
        options:
          - full
          - contract-only
          - engineering-only
          - challenge-only

permissions:
  contents: read

concurrency:
  group: omega-nemotron-live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nemotron-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'challenge-only' && 12 || 5 }}
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NYX_CONTRACT_TRIALS: ${{ inputs.mode == 'contract-only' && '1' || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Confirm encrypted credential is available
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: test -n "$NVIDIA_API_KEY"
      - name: Run bounded live Nemotron smoke
        if: inputs.mode == 'full'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run omega:nvidia:smoke
      - name: Run bounded Νύξ typed-contract compliance check
        if: inputs.mode == 'full' || inputs.mode == 'contract-only'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run omega:nyx:contract-compliance
      - name: Run live bounded Νύξ engineering loop
        if: inputs.mode == 'full' || inputs.mode == 'engineering-only'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run omega:nyx:live-engineering
      - name: Validate complex challenge oracle before paid inference
        if: inputs.mode == 'challenge-only'
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaSchedulerChallenge.test.ts
      - name: Typecheck live evaluator scripts before paid inference
        if: inputs.mode == 'challenge-only'
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext
          --moduleResolution Bundler --skipLibCheck --allowImportingTsExtensions --types node
          scripts/omega/nyx-scheduler-challenge.ts scripts/omegaSchedulerChallenge.test.ts
          scripts/omega/nyx-quality-v4-live-eval.ts
      - name: Run one bounded multi-file scheduler challenge
        if: inputs.mode == 'challenge-only'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUALITY_SUITE: CHALLENGE
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-quality-v4-live-eval.ts
      - name: Preserve sanitized challenge outcome including failures
        if: always() && inputs.mode == 'challenge-only'
        uses: actions/upload-artifact@v4
        with:
          name: nyx-scheduler-challenge-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-quality-challenge-*.json
          if-no-files-found: warn
          retention-days: 14
