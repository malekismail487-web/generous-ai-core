name: Omega NYX frozen reasoning challenge comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  general-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify provider fences, session disposal, paired accounting and independent procedural oracles
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxChatCli.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxTextBenchmark.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs --input-type=module -e "import {generalReasoningTasks} from './scripts/omega/benchmarks/generalReasoningTasks.ts';process.stdout.write(JSON.stringify(['DEVELOPMENT','TRANSFER','CHALLENGE'].flatMap(generalReasoningTasks)));" | python -B scripts/omega/benchmarks/check-general-reasoning-oracles.py
          node scripts/typescript/typecheck-ratchet.mjs
          node scripts/security/scan-secrets.mjs
          node scripts/omega/run-tests.mjs
          npm run build
      - name: Twelve frozen fresh challenge tasks; paired first attempts without tuning or answer repair
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_TEXT_CONFIGURATION: SESSION_SUPER_PHASE_CONTRACT
          NYX_TEXT_DELIVERY: SCOPED_FILE
          NYX_TEXT_RECOVERY_PROFILE: BOUNDED_RECOVERY
          NYX_TEXT_TRANSIENT_RECOVERY: WITHIN_SHARED_BUDGET
          NYX_TEXT_CAPACITY_SCHEDULING: BEFORE_TASK_LEASE
          NYX_TEXT_EVALUATION_MODEL: nvidia/nemotron-3-super-120b-a12b
          NYX_TEXT_EPOCH_MODE: GENERAL_REPAIR_CHALLENGE
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/nyx-general-challenge"
          mkdir -p "$base"
          RUNNER_TEMP="$base" node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-text-benchmark-epoch.ts
      - name: Preserve sanitized reports, not raw inference, keys or official benchmark reference data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-general-challenge-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-general-challenge/*.json
          if-no-files-found: error
