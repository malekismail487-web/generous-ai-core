name: Omega NYX cross-domain source representation ablation
on:
  workflow_dispatch:
  push:
    branches: [sol/omega-institutional-spine]
    paths: [scripts/omega/nyx-source-representation-cycle.ts]
permissions:
  contents: read
concurrency:
  # Share the baseline's provider lease: this experiment queues until it has finished.
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  representation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify unmodified safety and separate development task oracles
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaArcNyxIntegration.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBenchmarkCapabilityHarness.test.ts
      - name: Compare existing source representations with unchanged execution and private acceptance
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-source-representation-cycle.ts
      - name: Preserve sanitized development and transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-source-representation-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-source-representation-*.json
          if-no-files-found: error
