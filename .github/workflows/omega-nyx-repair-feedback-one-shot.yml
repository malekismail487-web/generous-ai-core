name: Omega NYX repair-feedback diagnostic

on:
  push:
    branches: [sol/omega-institutional-spine]
    paths:
      - .github/workflows/omega-nyx-repair-feedback-one-shot.yml

permissions:
  contents: read

jobs:
  paired-feedback-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NYX_QUALITY_SUITE: REPAIR_FEEDBACK_DIAGNOSTIC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Confirm encrypted model credential is available
        shell: bash
        run: test -n "$NVIDIA_API_KEY"
      - name: Verify predeclared fixture and bounded policy
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxFreshCircuitTopics.test.ts
      - name: Run paired feedback-policy diagnostic
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-quality-v4-live-eval.ts
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-nyx-repair-feedback-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-quality-repair_feedback_diagnostic-*.json
          if-no-files-found: warn
