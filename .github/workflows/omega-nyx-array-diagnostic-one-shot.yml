name: Omega NYX bounded structured-array mechanism diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  array-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify exact local diagnostic parser and unchanged integration
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaArcNyxIntegration.test.ts
      - name: Probe existing hosted and strict-local structured generation modes once
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-structured-array-diagnostic.ts
      - name: Preserve sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-array-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-array-diagnostic-*.json
          if-no-files-found: error
