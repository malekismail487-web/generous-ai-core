name: Omega NYX ARC Super configuration comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  super-configuration-transfer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nyx-arc-super-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify unchanged acceptance, authority, treatment forwarding and selection without secrets
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBenchmarkPopulation.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaArcNyxIntegration.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBenchmarkCapabilityHarness.test.ts
          npm run typecheck:ratchet
          node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --types node --skipLibCheck scripts/omegaNyxTextBenchmark.test.ts scripts/omegaArcNyxIntegration.test.ts scripts/omegaBenchmarkPopulation.test.ts scripts/omega/nyx-arc-benchmark-epoch.ts
      - name: Acquire pinned official population outside the source repository
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/arcprize/ARC-AGI-2.git "$RUNNER_TEMP/arc-agi-2"
          git -C "$RUNNER_TEMP/arc-agi-2" checkout f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Compare native none against bounded high reasoning on eight frozen fresh tasks
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_ARC_DATA_ROOT: ${{ runner.temp }}/arc-agi-2
          NYX_ARC_SUPER_COMPARISON: '1'
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-arc-benchmark-epoch.ts
      - name: Preserve sanitized final report and explicitly partial interruption checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-arc-super-configuration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-arc-public-*.json
            ${{ runner.temp }}/nyx-arc-progress-*.json
          if-no-files-found: error
