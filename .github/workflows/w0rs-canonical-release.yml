name: W0-RS canonical release gate

on:
  workflow_dispatch:
  push:
    branches:
      - "sol/w0-rs-1-truth-map"
    paths:
      - ".github/workflows/w0rs-canonical-release.yml"
      - "scripts/w0rs/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/schema/**"
      - "supabase/tests/**"
      - "supabase/legacy/lovable-migrations/manifest.json"
      - "supabase/legacy/lovable-migrations/checksums.sha256"

permissions:
  contents: read

jobs:
  canonical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Verify deterministic repository inputs
        run: |
          set -euo pipefail
          node scripts/w0rs/archive-manifest.mjs --check
          node scripts/w0rs/canonical-baseline.mjs --check
          node scripts/w0rs/inventory.mjs --check

      - name: Verify Docker-compatible runtime
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/w0rs-canonical"
          mkdir -p "$diagnostics"
          docker version > "$diagnostics/docker-version.txt" 2>&1
          docker info > "$diagnostics/docker-info.txt" 2>&1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Prepare isolated canonical workspace
        id: prepare
        run: |
          set -euo pipefail
          replay_root="$RUNNER_TEMP/w0rs-canonical-replay"
          project_id="w0rs-canonical-${GITHUB_RUN_ID}"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 1
          test "$(find supabase/legacy/lovable-migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 128
          test ! -e supabase/.temp/project-ref
          mkdir -p "$replay_root"
          rsync -a --exclude='.git' ./ "$replay_root/"
          sed -i -E "s/^project_id = .*/project_id = \"${project_id}\"/" "$replay_root/supabase/config.toml"
          printf 'project_id=%s\ncanonical_migration_count=1\nlegacy_archive_count=128\n' "$project_id" \
            > "$RUNNER_TEMP/w0rs-canonical/replay-input.txt"
          echo "replay_root=$replay_root" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Replay canonical baseline without shim
        id: replay
        env:
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          raw_log="$RUNNER_TEMP/w0rs-canonical/replay.raw.log"
          sanitized_log="$RUNNER_TEMP/w0rs-canonical/replay.log"
          set +e
          supabase --workdir "$REPLAY_ROOT" start --debug > "$raw_log" 2>&1
          replay_exit=$?
          set -e
          echo "exit_code=$replay_exit" >> "$GITHUB_OUTPUT"
          python3 - "$raw_log" "$sanitized_log" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = text.replace(os.environ["GITHUB_WORKSPACE"], "<workspace>")
          text = text.replace(os.environ["RUNNER_TEMP"], "<runner-temp>")
          text = re.sub(r"https://[a-z0-9-]+\.supabase\.co", "https://<redacted>.supabase.co", text, flags=re.I)
          text = re.sub(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}", "<redacted-jwt>", text)
          text = re.sub(r"(?:sbp_|sb_secret_)[A-Za-z0-9_-]{16,}", "<redacted-secret>", text)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          Path(sys.argv[1]).unlink(missing_ok=True)
          PY

      - name: Record canonical replay result
        env:
          REPLAY_EXIT: ${{ steps.replay.outputs.exit_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnostics = Path(os.environ["RUNNER_TEMP"]) / "w0rs-canonical"
          result = {
              "schemaVersion": 1,
              "scope": "canonical fresh-backend replay",
              "legacyMigrationsExecuted": False,
              "runnerShimApplied": False,
              "remoteProjectContacted": False,
              "exitCode": int(os.environ["REPLAY_EXIT"]),
              "reachedCanonicalHead": int(os.environ["REPLAY_EXIT"]) == 0,
          }
          (diagnostics / "summary.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY

      - name: Run canonical database and authority contract
        if: ${{ steps.replay.outputs.exit_code == '0' }}
        id: db_contract
        env:
          PROJECT_ID: ${{ steps.prepare.outputs.project_id }}
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          raw_log="$RUNNER_TEMP/w0rs-canonical/database-contract.raw.log"
          sanitized_log="$RUNNER_TEMP/w0rs-canonical/database-contract.log"
          db_container="$(docker ps --filter "name=supabase_db_${PROJECT_ID}" --format '{{.Names}}')"
          test -n "$db_container"
          set +e
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < "$REPLAY_ROOT/supabase/tests/w0rs_authority.sql" > "$raw_log" 2>&1
          contract_exit=$?
          set -e
          echo "exit_code=$contract_exit" >> "$GITHUB_OUTPUT"
          python3 - "$raw_log" "$sanitized_log" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = text.replace(os.environ["GITHUB_WORKSPACE"], "<workspace>")
          text = text.replace(os.environ["RUNNER_TEMP"], "<runner-temp>")
          text = re.sub(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}", "<redacted-jwt>", text)
          text = re.sub(r"(?:sbp_|sb_secret_)[A-Za-z0-9_-]{16,}", "<redacted-secret>", text)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          Path(sys.argv[1]).unlink(missing_ok=True)
          PY

      - name: Generate canonical types and first catalog fingerprint
        if: ${{ steps.replay.outputs.exit_code == '0' }}
        id: first_catalog
        env:
          PROJECT_ID: ${{ steps.prepare.outputs.project_id }}
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          diagnostics="$RUNNER_TEMP/w0rs-canonical"
          db_container="$(docker ps --filter "name=supabase_db_${PROJECT_ID}" --format '{{.Names}}')"
          set +e
          supabase --workdir "$REPLAY_ROOT" gen types typescript --local > "$diagnostics/generated-types.ts"
          types_exit=$?
          docker exec -i "$db_container" psql -U postgres -d postgres -qAt -v ON_ERROR_STOP=1 \
            < "$REPLAY_ROOT/scripts/w0rs/catalog-fingerprint.sql" > "$diagnostics/catalog-first.txt"
          catalog_exit=$?
          set -e
          sha256sum "$diagnostics/catalog-first.txt" > "$diagnostics/catalog-first.sha256"
          set +e
          diff -u "$REPLAY_ROOT/src/integrations/supabase/types.ts" "$diagnostics/generated-types.ts" \
            > "$diagnostics/generated-types.diff"
          types_match=$?
          set -e
          echo "types_exit=$types_exit" >> "$GITHUB_OUTPUT"
          echo "catalog_exit=$catalog_exit" >> "$GITHUB_OUTPUT"
          echo "types_match=$types_match" >> "$GITHUB_OUTPUT"

      - name: Replay canonical baseline a second time and compare catalog
        if: ${{ steps.replay.outputs.exit_code == '0' }}
        id: second_catalog
        env:
          PROJECT_ID: ${{ steps.prepare.outputs.project_id }}
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          diagnostics="$RUNNER_TEMP/w0rs-canonical"
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          set +e
          supabase --workdir "$REPLAY_ROOT" stop --no-backup > /dev/null 2>&1
          first_stop_exit=$?
          supabase --workdir "$REPLAY_ROOT" start --debug > "$diagnostics/replay-second.raw.log" 2>&1
          second_replay_exit=$?
          set -e
          if [ "$second_replay_exit" -eq 0 ]; then
            db_container="$(docker ps --filter "name=supabase_db_${PROJECT_ID}" --format '{{.Names}}')"
            docker exec -i "$db_container" psql -U postgres -d postgres -qAt -v ON_ERROR_STOP=1 \
              < "$REPLAY_ROOT/scripts/w0rs/catalog-fingerprint.sql" > "$diagnostics/catalog-second.txt"
            second_catalog_exit=$?
            sha256sum "$diagnostics/catalog-second.txt" > "$diagnostics/catalog-second.sha256"
            set +e
            cmp -s "$diagnostics/catalog-first.txt" "$diagnostics/catalog-second.txt"
            fingerprint_match=$?
            set -e
          else
            second_catalog_exit=1
            fingerprint_match=1
          fi
          python3 - "$diagnostics/replay-second.raw.log" "$diagnostics/replay-second.log" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = text.replace(os.environ["GITHUB_WORKSPACE"], "<workspace>")
          text = text.replace(os.environ["RUNNER_TEMP"], "<runner-temp>")
          text = re.sub(r"https://[a-z0-9-]+\.supabase\.co", "https://<redacted>.supabase.co", text, flags=re.I)
          text = re.sub(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}", "<redacted-jwt>", text)
          text = re.sub(r"(?:sbp_|sb_secret_)[A-Za-z0-9_-]{16,}", "<redacted-secret>", text)
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          Path(sys.argv[1]).unlink(missing_ok=True)
          PY
          printf 'first_stop_exit=%s\nsecond_replay_exit=%s\nsecond_catalog_exit=%s\nfingerprint_match=%s\n' \
            "$first_stop_exit" "$second_replay_exit" "$second_catalog_exit" "$fingerprint_match" \
            > "$diagnostics/catalog-comparison.txt"
          echo "first_stop_exit=$first_stop_exit" >> "$GITHUB_OUTPUT"
          echo "second_replay_exit=$second_replay_exit" >> "$GITHUB_OUTPUT"
          echo "second_catalog_exit=$second_catalog_exit" >> "$GITHUB_OUTPUT"
          echo "fingerprint_match=$fingerprint_match" >> "$GITHUB_OUTPUT"

      - name: Destroy ephemeral stack
        if: ${{ always() }}
        env:
          PROJECT_ID: ${{ steps.prepare.outputs.project_id }}
          REPLAY_ROOT: ${{ steps.prepare.outputs.replay_root }}
        run: |
          set -uo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          stop_exit="not-attempted"
          remaining=0
          if command -v supabase >/dev/null 2>&1 && [ -n "${REPLAY_ROOT:-}" ] && [ -d "$REPLAY_ROOT" ]; then
            set +e
            supabase --workdir "$REPLAY_ROOT" stop --no-backup >/dev/null 2>&1
            stop_exit=$?
            set -e
          fi
          if [ -n "${PROJECT_ID:-}" ]; then
            remaining="$(docker ps -a --format '{{.Names}}' | grep -F -c "$PROJECT_ID" || true)"
          fi
          printf 'stop_exit=%s\nremaining_project_containers=%s\n' "$stop_exit" "$remaining" \
            > "$RUNNER_TEMP/w0rs-canonical/cleanup.txt"
          test "$remaining" -eq 0

      - name: Upload sanitized canonical diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w0rs-canonical-${{ github.run_id }}
          path: ${{ runner.temp }}/w0rs-canonical
          if-no-files-found: error
          retention-days: 7

      - name: Require successful canonical replay
        if: ${{ always() }}
        env:
          REPLAY_EXIT: ${{ steps.replay.outputs.exit_code }}
          DB_CONTRACT_EXIT: ${{ steps.db_contract.outputs.exit_code }}
          TYPES_EXIT: ${{ steps.first_catalog.outputs.types_exit }}
          CATALOG_EXIT: ${{ steps.first_catalog.outputs.catalog_exit }}
          TYPES_MATCH: ${{ steps.first_catalog.outputs.types_match }}
          SECOND_REPLAY_EXIT: ${{ steps.second_catalog.outputs.second_replay_exit }}
          SECOND_CATALOG_EXIT: ${{ steps.second_catalog.outputs.second_catalog_exit }}
          FINGERPRINT_MATCH: ${{ steps.second_catalog.outputs.fingerprint_match }}
        run: |
          test "${REPLAY_EXIT:-1}" -eq 0
          test "${DB_CONTRACT_EXIT:-1}" -eq 0
          test "${TYPES_EXIT:-1}" -eq 0
          test "${CATALOG_EXIT:-1}" -eq 0
          test "${TYPES_MATCH:-1}" -eq 0
          test "${SECOND_REPLAY_EXIT:-1}" -eq 0
          test "${SECOND_CATALOG_EXIT:-1}" -eq 0
          test "${FINGERPRINT_MATCH:-1}" -eq 0
