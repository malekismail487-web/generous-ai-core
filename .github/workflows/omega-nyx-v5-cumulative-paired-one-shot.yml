name: Omega NYX V5 cumulative repair paired diagnostic

on:
  push:
    branches: [sol/omega-institutional-spine]
    paths:
      - .github/workflows/omega-nyx-v5-cumulative-paired-one-shot.yml

permissions:
  contents: read

jobs:
  matched-cumulative-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NYX_QUALITY_SUITE: V5_QUALITY_REPAIR
    steps:
      - name: Check out frozen incremental-review control
        uses: actions/checkout@v4
        with:
          ref: 9e9f6472b9c2846ccd987e906e1269dfc68a322c
          path: incremental
          fetch-depth: 0
      - name: Check out frozen cumulative-review candidate
        uses: actions/checkout@v4
        with:
          ref: 82b5951e75ec3a32d2f666bf3f9fc5abe0fc86e3
          path: cumulative
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify immutable arms and identical independent oracles
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          test "$(git -C incremental rev-parse HEAD)" = 9e9f6472b9c2846ccd987e906e1269dfc68a322c
          test "$(git -C cumulative rev-parse HEAD)" = 82b5951e75ec3a32d2f666bf3f9fc5abe0fc86e3
          for path in src/lib/codelab/assurance/engineeringQualityOracle.ts src/lib/codelab/assurance/r3EvaluatorIsolation.ts src/lib/codelab/assurance/holdoutAcceptanceIntegrity.ts; do
            cmp "incremental/$path" "cumulative/$path"
          done
      - name: Install frozen incremental dependencies
        working-directory: incremental
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install frozen cumulative dependencies
        working-directory: cumulative
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify both arms before live scoring
        shell: bash
        run: |
          (cd incremental && node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaCandidateEngineeringAdmission.test.ts)
          (cd cumulative && node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaCandidateEngineeringAdmission.test.ts)
      - name: Run frozen cumulative-review candidate
        working-directory: cumulative
        shell: bash
        run: env -u GITHUB_SHA node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-quality-v4-live-eval.ts
      - name: Run frozen incremental-review control
        working-directory: incremental
        shell: bash
        run: env -u GITHUB_SHA node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-quality-v4-live-eval.ts
      - name: Validate matched controls before interpreting outcomes
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.RUNNER_TEMP;
          const read = (sha) => JSON.parse(fs.readFileSync(path.join(root,
            `nyx-quality-v5_quality_repair-${sha.slice(0, 12)}.json`), 'utf8'));
          const a = read('9e9f6472b9c2846ccd987e906e1269dfc68a322c');
          const b = read('82b5951e75ec3a32d2f666bf3f9fc5abe0fc86e3');
          const controls = ['modelId', 'sourceRepresentation', 'intentCompilationMode',
            'cognitionContractDigest', 'taskFixtureDigests', 'qualityOracleVersion', 'budget', 'authority'];
          for (const key of controls) {
            if (JSON.stringify(a[key]) !== JSON.stringify(b[key])) throw new Error(`unmatched_control:${key}`);
          }
          if (a.tasks.length !== 7 || b.tasks.length !== 7
            || a.tasks.some((task, index) => task.taskId !== b.tasks[index].taskId)) {
            throw new Error('unmatched_seven_task_corpus');
          }
          if (!a.frozenCorePreserved || !b.frozenCorePreserved
            || a.contractChangedDuringScoredEval || b.contractChangedDuringScoredEval) {
            throw new Error('frozen_core_or_contract_not_preserved');
          }
          const summary = (report) => ({ commit: report.candidateCommit,
            qualityAccepted: report.tasks.filter((task) => task.engineeringQuality === 'ACCEPTED').length,
            functionalPasses: report.tasks.filter((task) => task.hiddenAcceptance === 'PASS').length,
            providerFailures: report.aggregateMetrics.providerFailureBreakdown,
            falseAcceptances: report.aggregateMetrics.falseAcceptanceRate,
            tokens: report.tasks.reduce((total, task) => total + task.totalTokens, 0) });
          console.log('MATCHED_CUMULATIVE_REPAIR_PAIR', JSON.stringify({
            controlsMatched: true, providerStable: a.aggregateMetrics.providerFailureRate === 0
              && b.aggregateMetrics.providerFailureRate === 0,
            incremental: summary(a), cumulative: summary(b) }));
          NODE
      - name: Upload sanitized paired reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-nyx-v5-cumulative-pair-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-quality-v5_quality_repair-*.json
          if-no-files-found: warn
