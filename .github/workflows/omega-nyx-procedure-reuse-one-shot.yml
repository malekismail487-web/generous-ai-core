name: Omega NYX bounded quantitative capability experiments
on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [native-generation, procedure-reuse, expression-graph, repair-context, direct-native, direct-model-repair, quantitative-diagnosis, formulation-bounds, algebraic-form]
        default: native-generation
        required: true
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  procedure-transfer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nyx-algebraic-transfer-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify procedure confinement, independent oracles and TypeScript zero
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBoundedReasoningWorkbench.test.ts
          npm run typecheck:ratchet
          node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --types node --skipLibCheck scripts/omega/nyx-native-generation-live-eval.ts scripts/omega/nyx-procedure-reuse-live-eval.ts scripts/omegaBoundedReasoningWorkbench.test.ts
      - name: Compare original and native-bound generation on four fresh cases
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'native-generation'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Compare bounded equations and positional expressions on four new parameter cases
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'expression-graph'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: EXPRESSION_GRAPH
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Compare objective-bound graphs with and without their own admitted repair context
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'repair-context'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: REPAIR_CONTEXT
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Diagnose reasoned direct certificates versus existing native graph generation
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'direct-native'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: DIRECT_NATIVE
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Generate two procedures once and compare recompute, context and bound invocation on fresh values
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'procedure-reuse'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-procedure-reuse-live-eval.ts
      - name: Compare direct repair and public mathematical reformulation from the same live first proposal
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'direct-model-repair'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: DIRECT_REFORMULATION
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Diagnose public-formulation contracts and exact-value rejection on two new cases
        if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'quantitative-diagnosis'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: FAILURE_DIAGNOSIS
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Compare legacy and bounded public-formulation guidance from shared first proposals on four new cases
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[nyx-formulation-bounds-once]') || github.event_name == 'workflow_dispatch' && inputs.experiment == 'formulation-bounds'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: FORMULATION_BOUNDS
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Compare positional graphs and mathematical surface formulas on four fresh parameter cases
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[nyx-algebraic-transfer-once]') || github.event_name == 'workflow_dispatch' && inputs.experiment == 'algebraic-form'
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_QUANTITATIVE_EXPERIMENT: ALGEBRAIC_FORM
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-native-generation-live-eval.ts
      - name: Preserve sanitized bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-pure-computation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-procedure-reuse-*.json
            ${{ runner.temp }}/nyx-native-generation-*.json
            ${{ runner.temp }}/nyx-expression-transfer-*.json
            ${{ runner.temp }}/nyx-repair-context-*.json
            ${{ runner.temp }}/nyx-direct-native-*.json
            ${{ runner.temp }}/nyx-direct-model-repair-*.json
            ${{ runner.temp }}/nyx-quantitative-diagnosis-*.json
            ${{ runner.temp }}/nyx-formulation-bounds-*.json
            ${{ runner.temp }}/nyx-algebraic-transfer-*.json
          if-no-files-found: error
