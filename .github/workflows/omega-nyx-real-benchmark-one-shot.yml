name: Omega NYX actual ARC public evaluation baseline
on:
  workflow_dispatch:
  push:
    branches: [sol/omega-institutional-spine]
    paths: [scripts/omega/nyx-arc-benchmark-epoch.ts]
permissions:
  contents: read
concurrency:
  group: omega-real-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-arc:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify existing strict adapter and oracle without credentials
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaArcNyxIntegration.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBenchmarkCapabilityHarness.test.ts
      - name: Download pinned actual ARC dataset outside candidate repository
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/arcprize/ARC-AGI-2.git "$RUNNER_TEMP/arc-agi-2"
          git -C "$RUNNER_TEMP/arc-agi-2" checkout f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Run frozen actual public evaluation subset once
        env:
          OMEGA_ALLOW_NVIDIA_NETWORK: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NYX_ARC_DATA_ROOT: ${{ runner.temp }}/arc-agi-2
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-arc-benchmark-epoch.ts
      - name: Preserve sanitized inference and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-arc-public-${{ github.sha }}
          path: ${{ runner.temp }}/nyx-arc-public-*.json
          if-no-files-found: error
