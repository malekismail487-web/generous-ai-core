name: Omega NYX frontier reasoning gauntlet

# Live gauntlets remain opt-in while the experiment is frozen.
on:
  # One bounded correction run; remove this trigger immediately after dispatch.
  push:
    branches: [sol/omega-institutional-spine]
    paths: [scripts/omega/nyx-workbench-transfer-live-eval.ts]
  workflow_dispatch:
    inputs:
      workbench_comparison:
        description: Run the bounded constructive-tool ablation, not the legacy engineering suites
        type: boolean
        default: false
      transfer_comparison:
        description: Run only the fresh eight-task finite transfer comparison
        type: boolean
        default: false
      proof_comparison:
        description: Compare current workbench against proof-bearing workbench on eight frozen new tasks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: omega-nyx-frontier-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nyx-frontier-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Confirm encrypted credential is available
        shell: bash
        run: test -n "$NVIDIA_API_KEY"
      - name: Verify gauntlet, provider, authority, and TypeScript contracts
        run: |
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaFrontierReasoningGauntlet.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaBoundedReasoningWorkbench.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNyxWorkbenchTransfer.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaFiniteRefutation.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaNvidiaNimProvider.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaVerificationIntegrity.test.ts
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omegaSchedulerChallenge.test.ts
          npm run typecheck:ratchet
      - name: Run live frontier reasoning and engineering gauntlets
        if: github.event_name == 'workflow_dispatch' && !inputs.workbench_comparison && !inputs.transfer_comparison && !inputs.proof_comparison
        shell: bash
        run: |
          npm run omega:nvidia:smoke
          set +e
          npm run omega:nyx:frontier-reasoning
          frontier_exit=$?
          engineering_exit=0
          for configuration in CURRENT REASONING_ENABLED MINIMAL_REFERENCE; do
            NYX_QUALITY_SUITE=FRONTIER_CHALLENGE NYX_EXPERIMENT_VARIANT="$configuration" npm run omega:nyx:quality-holdout:v4
            configuration_exit=$?
            echo "configuration=$configuration exit=$configuration_exit"
            if [ "$configuration_exit" -ne 0 ]; then
              engineering_exit=1
            fi
          done
          set -e
          echo "frontier_exit=$frontier_exit engineering_exit=$engineering_exit"
          if [ "$frontier_exit" -ne 0 ] || [ "$engineering_exit" -ne 0 ]; then
            exit 1
          fi
      - name: Run frozen baseline and computational-workbench comparison
        if: inputs.workbench_comparison && !inputs.transfer_comparison && !inputs.proof_comparison
        shell: bash
        run: |
          set +e
          for variant in BASELINE WORKBENCH; do
            NYX_FRONTIER_VARIANT="$variant" npm run omega:nyx:frontier-reasoning
            echo "variant=$variant exit=$?"
          done
          set -e
          node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-frontier-workbench-compare.ts
      - name: Run fresh paired finite reasoning transfer comparison
        if: inputs.transfer_comparison && !inputs.proof_comparison
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-workbench-transfer-live-eval.ts
      - name: Run frozen paired proof-evidence ablation
        if: github.event_name == 'push' || inputs.proof_comparison
        env:
          NYX_TRANSFER_PROOF_ABLATION: "1"
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-workbench-transfer-live-eval.ts
      - name: Upload sanitized live reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-nyx-frontier-gauntlet-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nyx-frontier-reasoning-*.json
            ${{ runner.temp }}/nyx-frontier-workbench-comparison-*.json
            ${{ runner.temp }}/nyx-workbench-transfer-*.json
            ${{ runner.temp }}/nyx-quality-*.json
          if-no-files-found: warn
