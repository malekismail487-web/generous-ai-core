name: Omega NYX CLI live isolated one-shot

on:
  workflow_dispatch:
  push:
    branches:
      - sol/omega-institutional-spine
    paths:
      - .github/workflows/omega-nyx-cli-live-one-shot.yml

permissions:
  contents: read

concurrency:
  group: omega-nyx-cli-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nyx-cli-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMEGA_ALLOW_NVIDIA_NETWORK: "1"
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify local typed boundary before live call
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs --test scripts/omegaNyxChatCli.test.ts
      - name: Check injected credential availability without printing it
        shell: bash
        run: test -n "$NVIDIA_API_KEY"
      - name: Exercise live chat, isolated edit, and fixed verifier
        run: node --experimental-strip-types --import ./scripts/w0rs/register-typescript-loader.mjs scripts/omega/nyx-cli-live-eval.ts
